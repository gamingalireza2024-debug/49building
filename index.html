<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ساختمان ۴۹ — سامانه مدیریت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.7/dist/jalaali.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#070810; --panel:#0d1424; --panel2:#101a2e; --panel3:#16203a;
  --border:#222d44; --text:#eef1f8; --muted:#8a93a6; --faint:#5c6478;
  --primary:#e8b84b; --primary-d:#c8952e; --primary-soft:#2a2110;
  --gold:linear-gradient(135deg,#f5d47a,#d4a437 45%,#c8952e);
  --gold-line:linear-gradient(135deg,#f5d47a,#c8952e);
  --green:#2dd4a7; --green-soft:#0e2e26; --red:#ff5c7c; --red-soft:#3a1622;
  --amber:#ffb84d; --amber-soft:#3a2c12; --blue:#4d8dff; --blue-soft:#13233f;
  --radius:16px; --shadow:0 14px 40px rgba(0,0,0,.5); --gold-glow:0 0 24px rgba(232,184,75,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Vazirmatn',Tahoma,sans-serif;color:var(--text);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;
  background:
    repeating-linear-gradient(135deg,transparent 0,transparent 92px,rgba(232,184,75,.022) 92px,rgba(232,184,75,.022) 93px),
    radial-gradient(1100px 560px at 82% -12%,rgba(232,184,75,.08),transparent 60%),
    radial-gradient(900px 480px at -8% 112%,rgba(77,141,255,.05),transparent 60%),
    #070810;
  background-attachment:fixed;
}
a{color:var(--primary);text-decoration:none}
input,select,textarea,button{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(#3a2f12,#222d44);border-radius:8px}
::selection{background:rgba(232,184,75,.3)}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 18px rgba(232,184,75,.18)}50%{box-shadow:0 0 34px rgba(232,184,75,.42)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .6s cubic-bezier(.22,.9,.3,1) both}
.gld-bd{border:1px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--gold-line) border-box}
.txt-gold{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- auth / setup screens ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(900px 500px at 70% -10%,rgba(232,184,75,.13),transparent),radial-gradient(900px 500px at 10% 110%,rgba(13,20,36,.8),transparent),#070810}
.auth-card{width:100%;max-width:420px;background:rgba(13,20,36,.72);backdrop-filter:blur(14px);border:1px solid rgba(232,184,75,.28);
  border-radius:22px;padding:34px;box-shadow:var(--shadow),var(--gold-glow);animation:fadeUp .6s both}
.auth-logo{display:flex;justify-content:center;margin-bottom:14px}
.auth-logo img{height:88px;width:auto;filter:drop-shadow(0 6px 20px rgba(232,184,75,.55));animation:floaty 5s ease-in-out infinite}
.auth-title{text-align:center;font-size:21px;font-weight:800;margin-bottom:4px}
.auth-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;background:rgba(16,26,46,.85);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:11px 13px;transition:.15s;outline:none}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(232,184,75,.18)}
textarea.inp{resize:vertical;min-height:80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
  border-radius:12px;padding:11px 18px;font-weight:600;transition:.18s;background:var(--panel3);color:var(--text)}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn-primary{background:var(--gold);color:#1a1208;font-weight:700;box-shadow:0 6px 18px rgba(232,184,75,.3)}
.btn-primary:hover{box-shadow:0 8px 26px rgba(232,184,75,.45)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--red-soft);color:var(--red);border:1px solid #4a1d2b}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%}
.req-star{color:var(--primary);font-weight:700;margin-right:2px}
.auth-switch{text-align:center;margin-top:16px;font-size:12.5px;color:var(--muted)}
.auth-switch a{cursor:pointer;font-weight:600}
.auth-tabs{display:flex;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:18px}
.auth-tabs button{flex:1;background:transparent;border:none;color:var(--muted);padding:8px;border-radius:9px;cursor:pointer;font-weight:600}
.auth-tabs button.active{background:var(--gold);color:#1a1208}
.hint{background:rgba(232,184,75,.08);border:1px solid rgba(232,184,75,.25);color:#e8c97a;font-size:12px;border-radius:11px;padding:10px 12px;margin-top:14px;line-height:1.9}

/* ---------- app shell ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:250px;flex-shrink:0;background:#0b1120;border-left:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-head{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--border)}
.side-head img{height:40px;width:40px;border-radius:10px;filter:drop-shadow(0 0 10px rgba(232,184,75,.4))}
.side-head .bn{font-weight:800;font-size:15px}
.side-head .bn small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.nav{flex:1;overflow-y:auto;padding:10px}
.nav .grp{font-size:11px;color:var(--faint);padding:14px 12px 6px;letter-spacing:.5px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--muted);
  cursor:pointer;transition:.14s;font-weight:500;margin-bottom:2px}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.active{background:var(--gold);color:#1a1208;font-weight:700;box-shadow:0 4px 14px rgba(232,184,75,.3)}
.nav a .ic{width:20px;text-align:center;font-size:16px;opacity:.9}
.nav a .bd{margin-right:auto;background:var(--red);color:#fff;border-radius:20px;font-size:10px;padding:1px 7px;font-weight:700}
.side-foot{padding:12px;border-top:1px solid var(--border);font-size:12px}
.side-foot .u{display:flex;align-items:center;gap:9px}
.side-foot .av{width:34px;height:34px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1208}
.side-foot .nm{font-weight:600;font-size:13px}
.side-foot .rl{color:var(--muted);font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;background:rgba(11,17,32,.88);backdrop-filter:blur(12px);z-index:20}
.topbar .tt{font-size:17px;font-weight:800}
.topbar .sp{margin-right:auto;display:flex;align-items:center;gap:10px}
.topbar .jm{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:6px 12px;font-size:12.5px;color:var(--muted)}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
.pill-admin{background:rgba(232,184,75,.16);color:#e8b84b;border:1px solid rgba(232,184,75,.3)}
.pill-member{background:var(--blue-soft);color:#a9c6ff}
.content{padding:22px;flex:1}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:700}
.page-head .desc{color:var(--muted);font-size:13px}
.page-head .acts{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- cards / grids ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:linear-gradient(180deg,var(--panel),#0a1020);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:.18s}
.card:hover{border-color:rgba(232,184,75,.3);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card h3{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:6px}
.kpi{position:relative;overflow:hidden}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500}
.kpi .ic{position:absolute;left:16px;top:16px;width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px}
.kpi.green .v{color:var(--green)} .kpi.green .ic{background:var(--green-soft);color:var(--green)}
.kpi.red .v{color:var(--red)} .kpi.red .ic{background:var(--red-soft);color:var(--red)}
.kpi.amber .v{color:var(--amber)} .kpi.amber .ic{background:var(--amber-soft);color:var(--amber)}
.kpi.blue .v{color:var(--blue)} .kpi.blue .ic{background:var(--blue-soft);color:var(--blue)}
.kpi.violet .v{color:var(--primary)} .kpi.violet .ic{background:var(--primary-soft);color:var(--primary)}
.kpi .sub{font-size:12px;color:var(--faint);margin-top:4px}
.charts{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media(max-width:980px){.charts{grid-template-columns:1fr}}
.chart-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.chart-box h3{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--text)}
.chart-box canvas{max-height:300px}
.tbl-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:11px 13px;text-align:right;white-space:nowrap}
thead th{color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--border);background:var(--panel2)}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:hover{background:var(--panel2)}
td.num,th.num{text-align:left;font-variant-numeric:tabular-nums}
.row-actions{display:flex;gap:6px}
.empty{text-align:center;padding:40px;color:var(--faint);font-size:13px}

/* ---------- unit grid ---------- */
.units-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.unit-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.unit-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.unit-card .un{font-size:24px;font-weight:800;color:var(--primary)}
.unit-card .fl{font-size:11px;color:var(--faint)}
.unit-card .ow{font-size:12.5px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-card .bal{margin-top:10px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;display:inline-block}
.bal-clear{background:var(--green-soft);color:var(--green)}
.bal-debt{background:var(--red-soft);color:var(--red)}
.bal-cred{background:var(--blue-soft);color:#a9c6ff}
.floor-label{grid-column:1/-1;font-size:12px;color:var(--faint);margin:6px 0 -2px;font-weight:600}

/* ---------- badges / misc ---------- */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-monthly{background:var(--blue-soft);color:#a9c6ff}
.b-construction{background:var(--amber-soft);color:#f1c97a}
.b-open{background:var(--red-soft);color:var(--red)}
.b-prog{background:var(--amber-soft);color:#f1c97a}
.b-done{background:var(--green-soft);color:var(--green)}
.stat{display:inline-flex;align-items:center;gap:6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters select,.filters input{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px 11px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.tiny{font-size:11.5px}
.divider{height:1px;background:var(--border);margin:14px 0}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,10,16,.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal-head h3{font-size:16px;font-weight:700}
.modal-head .x{margin-right:auto;cursor:pointer;color:var(--muted);font-size:20px;background:none;border:none}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-start}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row .full{grid-column:1/-1}
@media(max-width:560px){.form-row{grid-template-columns:1fr}}

/* ---------- toast ---------- */
#toasts{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel3);border:1px solid var(--border);border-right:4px solid var(--primary);border-radius:10px;padding:12px 16px;min-width:240px;box-shadow:var(--shadow);font-size:13px;animation:slin .25s}
.toast.ok{border-right-color:var(--green)} .toast.err{border-right-color:var(--red)} .toast.warn{border-right-color:var(--amber)}
@keyframes slin{from{transform:translateX(-20px);opacity:0}to{transform:none;opacity:1}}

/* ---------- ledger / profile ---------- */
.ledger-tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.ledger-tabs button{background:none;border:none;color:var(--muted);padding:10px 14px;cursor:pointer;font-weight:600;border-bottom:2px solid transparent}
.ledger-tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.info-item{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.info-item .l{font-size:11.5px;color:var(--muted)} .info-item .v{font-size:14px;font-weight:600;margin-top:2px}

.ham{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer}
@media(max-width:860px){
  .sidebar{position:fixed;right:-260px;z-index:50;transition:.25s}
  .sidebar.open{right:0}
  .ham{display:block}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.scrim.show{display:block}

/* ============ لندینگ پیج عمومی ============ */
.land{min-height:100vh;position:relative}
.ltop{position:sticky;top:0;z-index:40;background:rgba(8,10,18,.8);backdrop-filter:blur(14px);border-bottom:1px solid rgba(232,184,75,.18)}
.ltop-in{max-width:1200px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:14px}
.ltop .lg{display:flex;align-items:center;gap:11px;font-weight:800;font-size:16px}
.ltop .lg img{height:42px;width:42px;border-radius:11px;filter:drop-shadow(0 0 12px rgba(232,184,75,.5));animation:floaty 6s ease-in-out infinite}
.ltop .lnav{display:flex;gap:4px;margin-right:auto}
.ltop .lnav a{color:var(--muted);padding:8px 13px;border-radius:10px;font-weight:500;font-size:13.5px;cursor:pointer;transition:.15s}
.ltop .lnav a:hover{background:rgba(232,184,75,.1);color:var(--primary)}
.lwrap{max-width:1200px;margin:0 auto;padding:0 22px}

/* هیرو با ویدیوی پس‌زمینه */
.hero{position:relative;border-radius:26px;overflow:hidden;margin:24px 0;min-height:560px;display:flex;align-items:center;
  border:1px solid rgba(232,184,75,.25);box-shadow:var(--shadow),var(--gold-glow)}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero::after{content:'';position:absolute;inset:0;z-index:1;
  background:linear-gradient(115deg,rgba(7,8,16,.93) 0%,rgba(7,8,16,.72) 45%,rgba(7,8,16,.35) 100%)}
.hero::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent 0,transparent 120px,rgba(232,184,75,.06) 120px,rgba(232,184,75,.06) 121px)}
.hero-in{position:relative;z-index:3;max-width:640px;padding:70px 44px}
.hero .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(232,184,75,.14);border:1px solid rgba(232,184,75,.35);
  color:#f0c75e;border-radius:30px;padding:6px 14px;font-size:12.5px;font-weight:600;margin-bottom:18px;animation:fadeUp .6s both}
.hero h1{font-size:42px;font-weight:800;line-height:1.45;color:#fff;margin-bottom:14px;animation:fadeUp .7s both}
.hero h1 .ac{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:rgba(235,238,245,.82);font-size:15px;max-width:520px;line-height:2;margin-bottom:26px;animation:fadeUp .8s both}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;animation:fadeUp .9s both}
@media(max-width:780px){.hero{min-height:480px}.hero-in{padding:48px 24px}.hero h1{font-size:30px}}

.lsec{padding:48px 0;animation:fadeUp .6s both}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sec-head .bar{width:5px;height:28px;background:var(--gold-line);border-radius:4px}
.lsec h2{font-size:26px;font-weight:800}
.lsec .sub{color:var(--muted);font-size:14px;margin-bottom:24px}

/* درب کد دسترسی ساکنین */
.gate{background:rgba(13,20,36,.62);backdrop-filter:blur(16px);border:1px solid rgba(232,184,75,.3);
  border-radius:20px;padding:32px;max-width:560px;margin:0 auto;box-shadow:var(--shadow),var(--gold-glow);animation:scaleIn .5s both}
.gate h3{font-size:19px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.gate .g-sub{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.9}
.gate-row{display:flex;gap:10px}
.gate-row .inp{flex:1;text-align:center;font-size:18px;letter-spacing:6px;font-weight:700}

.info-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.info-card{background:linear-gradient(180deg,var(--panel),#0a1020);border:1px solid var(--border);border-radius:16px;padding:20px;transition:.18s}
.info-card:hover{border-color:rgba(232,184,75,.35);transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.info-card .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:12px}
.info-card .lb{font-size:12px;color:var(--muted);margin-bottom:4px}
.info-card .vv{font-size:16px;font-weight:700;direction:ltr;text-align:right}
.info-card .vv.fa{direction:rtl}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#25d366;color:#fff;border-radius:12px;padding:13px;font-weight:700;margin-top:14px;box-shadow:0 8px 20px rgba(37,211,102,.25)}

.units-section .units-grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.units-section .unit-card .un{font-size:30px}
.unit-card{background:linear-gradient(180deg,var(--panel),#0a1020);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.unit-card::before{content:'';position:absolute;top:0;right:0;left:0;height:2px;background:var(--gold-line);opacity:.6}
.unit-card:hover{transform:translateY(-4px);border-color:rgba(232,184,75,.4);box-shadow:0 12px 30px rgba(0,0,0,.45)}

.ann-card{background:linear-gradient(180deg,var(--panel),#0a1020);border:1px solid var(--border);border-right:4px solid var(--primary);border-radius:12px;padding:16px 18px;transition:.18s}
.ann-card:hover{border-right-color:#f0c75e;transform:translateY(-2px)}
.ann-card h4{font-size:15px;margin-bottom:4px}
.ann-card .dt{font-size:11px;color:var(--faint);margin-bottom:8px}
.ann-card .bd{font-size:13.5px;color:var(--muted);line-height:1.9;white-space:pre-wrap}

.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:780px){.contact-grid{grid-template-columns:1fr}}
.contact-card{background:linear-gradient(180deg,var(--panel),#0a1020);border:1px solid var(--border);border-radius:16px;padding:22px}
.contact-card h3{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}

.lfooter{border-top:1px solid var(--border);padding:28px 0;margin-top:24px;color:var(--faint);font-size:12.5px;text-align:center}
.lfooter a{color:var(--muted)}

.pub-unit{background:linear-gradient(180deg,var(--panel),#0a1020);border:1px solid rgba(232,184,75,.25);border-radius:20px;padding:32px;max-width:760px;margin:34px auto;box-shadow:var(--shadow)}
.pub-unit .back{margin-bottom:18px}
.pub-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.pub-head .num{font-size:48px;font-weight:800;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.pub-head .meta{color:var(--muted);font-size:13px}
.status-big{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:12px;font-weight:700;font-size:15px}
.showcase{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sc-photo{height:270px;border-radius:18px;background-size:cover;background-position:center;border:1px solid rgba(232,184,75,.2);box-shadow:0 12px 30px rgba(0,0,0,.45);transition:.22s}
.sc-photo:hover{transform:translateY(-5px) scale(1.01);border-color:rgba(232,184,75,.45);box-shadow:0 16px 36px rgba(0,0,0,.55)}
@media(max-width:780px){.showcase{grid-template-columns:1fr}.sc-photo{height:200px}}
.floor-label{font-size:13px;color:var(--primary);font-weight:700;margin:18px 0 10px;letter-spacing:.5px}
.land-empty{padding:60px;text-align:center;color:var(--faint)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<script>
/* =====================================================================
   ساختمان ۴۹ — اپلیکیشن مدیریت (تک‌فایل)
   ===================================================================== */
const B49 = {};

// ---- پیکربندی اتصال به Supabase ----
B49.DEFAULT_URL = 'https://axfjnhllvzesydwpmndw.supabase.co';
B49.cfg = {
  url: localStorage.getItem('b49_url') || B49.DEFAULT_URL,
  key: localStorage.getItem('b49_key') || ''
};
B49.sb = null;
try { if (B49.cfg.url && B49.cfg.key) B49.sb = supabase.createClient(B49.cfg.url, B49.cfg.key); } catch(e){}

// ---- وضعیت ----
B49.user = null; B49.profile = null; B49.cache = {};

// ---- کمک‌تابع‌ها ----
const $ = (s,p=document)=>p.querySelector(s);
const $$ = (s,p=document)=>[...p.querySelectorAll(s)];
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
B49.toast=(m,t='ok')=>{const e=el('div','toast '+t,m);$('#toasts').appendChild(e);setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),300)},3200);};
B49.faDigits=s=>String(s==null?'':s).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
B49.rial=n=>{if(n==null||isNaN(n))n=0;n=Number(n);const sign=n<0?'-':'';n=Math.abs(Math.round(n));return B49.faDigits(sign+n.toLocaleString('en-US'))+' ریال';};
B49.rialShort=n=>{if(!n)n=0;n=Number(n);const a=Math.abs(n);const s=n<0?'-':'';if(a>=1e9)return s+B49.faDigits((a/1e9).toFixed(1).replace(/\.0$/,''))+' میلیارد';if(a>=1e6)return s+B49.faDigits((a/1e6).toFixed(1).replace(/\.0$/,''))+' میلیون';return B49.rial(n);};
B49.escape=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
B49.toEn=s=>String(s==null?'':s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
B49.fmtMoneyLive=inp=>{const raw=B49.toEn(inp.value).replace(/[^\d]/g,'');inp.value=raw?B49.faDigits(parseInt(raw).toLocaleString('en-US')):'';};
// نگاشت ارورهای ساپابیس/پستگرس به فارسی
B49.faErr=msg=>{let m=String(msg||'').toLowerCase();console.warn('[DB error]',msg);
  if(/invalid login credentials|invalid credentials/.test(m))return 'ایمیل یا رمز عبور اشتباه است.';
  if(/user already registered/.test(m))return 'این ایمیل قبلاً ثبت‌نام کرده است. از «ورود» استفاده کنید.';
  if(/password should be at least|weak password/.test(m))return 'رمز عبور باید حداقل ۶ کاراکتر باشد.';
  if(/email not confirmed/.test(m))return 'ایمیل شما تأیید نشده است; صندوق ورودی را بررسی کنید.';
  if(/rate limit|too many requests/.test(m))return 'تلاش بیش از حد; چند دقیقه بعد دوباره امتحان کنید.';
  if(/jwt expired|token.*expired|not authenticated/.test(m))return 'نشست شما منقضی شده; دوباره وارد شوید.';
  if(/row-level security|rls|permission denied|policy/.test(m))return 'دسترسی ندارید. فقط مدیر می‌تواند این کار را کند; اگر مدیر هستید، نقش را در جدول profiles روی admin بگذارید.';
  if(/duplicate key|unique constraint/.test(m))return 'این رکورد تکراری است و قبلاً ثبت شده است.';
  if(/not-null constraint|null value.*not allowed/.test(m))return 'یک فیلد اجباری خالی مانده است; همه‌ی فیلدهای ستاره‌دار را پر کنید.';
  if(/foreign key|violates foreign/.test(m))return 'آیتم مرتبط (مثلاً واحد یا دسته) معتبر نیست; ابتدا آن را بسازید.';
  if(/check constraint|invalid input value/.test(m))return 'یکی از مقادیر مجاز نیست (مثلاً نوع یا روش نامعتبر).';
  if(/column.*does not exist|could not find the .*(column|type)/.test(m))return 'خطای داخلی سامانه: ستون نامعتبر. با پشتیبانی تماس بگیرید.';
  if(/network|failed to fetch|load failed/.test(m))return 'خطای اتصال به سرور; اینترنت یا اتصال به ساپابیس را بررسی کنید.';
  if(/timeout/.test(m))return 'پاسخ سرور خیلی طول کشید; دوباره تلاش کنید.';
  return 'خطا: '+msg;
};
B49.lb=(l,r)=>`${l}${r?'<span class="req-star">*</span>':''}`;
B49._logoUrl=null;
B49.logoUrl=async()=>{if(B49._logoUrl!==null)return B49._logoUrl;try{const r=await fetch('logo.png');if(!r.ok)throw 0;const b=await r.blob();B49._logoUrl=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res('');fr.readAsDataURL(b);});}catch(e){B49._logoUrl='';}return B49._logoUrl;};

// ---- تقویم شمسی (jalaali-js) ----
B49.jNow=()=>{const d=new Date();const j=jalaali.toJalaali(d.getFullYear(),d.getMonth()+1,d.getDate());return {jy:j.jy,jm:j.jd?j.jm:j.jm,jd:j.jd,y:j.jy,m:j.jm,d:j.jd};};
B49.jMonths=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
B49.jMonthStr=(jy,jm)=>jy+'/'+String(jm).padStart(2,'0');
B49.jMonthLabel=s=>{if(!s)return '';const [y,m]=s.split('/').map(Number);return (B49.jMonths[m-1]||'')+' '+B49.faDigits(y);};
B49.gToJstr=ds=>{if(!ds)return '';const d=new Date(ds);const j=jalaali.toJalaali(d.getFullYear(),d.getMonth()+1,d.getDate());return B49.faDigits(j.jy+'/'+String(j.jm).padStart(2,'0')+'/'+String(j.jd).padStart(2,'0'));};
B49.jToG=(jy,jm,jd)=>{const g=jalaali.toGregorian(jy,jm,jd);return `${g.gy}-${String(g.gm).padStart(2,'0')}-${String(g.gd).padStart(2,'0')}`;};
B49.todayJalali=()=>{const j=B49.jNow();return B49.faDigits(j.y+'/'+String(j.m).padStart(2,'0')+'/'+String(j.d).padStart(2,'0'));};

// ---- درخواست‌های داده ----
B49.q = {
  async all(table,sel='*',order=null){
    let q=B49.sb.from(table).select(sel);
    if(order)q=q.order(order[0],{ascending:order[1]});
    const {data,error}=await q; if(error)B49.toast(B49.faErr(error.message),'err'); return data||[];
  },
  async insert(table,row){const {data,error}=await B49.sb.from(table).insert(row).select(); if(error){B49.toast(B49.faErr(error.message),'err');return null;} B49.toast('ذخیره شد','ok'); return data[0];},
  async update(table,id,row){const {data,error}=await B49.sb.from(table).update(row).eq('id',id).select(); if(error){B49.toast(B49.faErr(error.message),'err');return null;} B49.toast('به‌روز شد','ok'); return data[0];},
  async del(table,id){const {error}=await B49.sb.from(table).delete().eq('id',id); if(error){B49.toast(B49.faErr(error.message),'err');return false;} B49.toast('حذف شد','warn'); return true;}
};

// ---- مودال ----
B49.modal=(title,bodyHtml,footHtml='')=>{
  const bg=el('div','modal-bg');
  bg.innerHTML=`<div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x">×</button></div><div class="modal-body">${bodyHtml}</div>${footHtml?`<div class="modal-foot">${footHtml}</div>`:''}</div>`;
  bg.addEventListener('click',e=>{if(e.target===bg||e.target.classList.contains('x'))bg.remove();});
  document.body.appendChild(bg);return bg;
};

// ---- فرمjalali date input (سه انتخابی) ----
B49.jDateField=(name,val)=>{
  const j=B49.jNow(); let vy=j.y,vm=j.m,vd=j.d;
  if(val){const p=String(val).split('/').map(Number);if(p.length===3){vy=p[0];vm=p[1];vd=p[2];}}
  const ys=[];for(let y=j.y+1;y>=j.y-6;y--)ys.push(`<option value="${y}" ${y===vy?'selected':''}>${B49.faDigits(y)}</option>`);
  const ms=B49.jMonths.map((n,i)=>`<option value="${i+1}" ${i+1===vm?'selected':''}>${n}</option>`).join('');
  const ds=[];for(let d=1;d<=31;d++)ds.push(`<option value="${d}" ${d===vd?'selected':''}>${B49.faDigits(d)}</option>`);
  return `<div class="form-row"><select class="inp" data-jd="${name}-y">${ys.join('')}</select><select class="inp" data-jd="${name}-m">${ms}</select><select class="inp" data-jd="${name}-d">${ds.join('')}</select></div>`;
};
B49.jDateVal=(bg,name)=>{const y=bg.querySelector(`[data-jd="${name}-y"]`).value,m=bg.querySelector(`[data-jd="${name}-m"]`).value,d=bg.querySelector(`[data-jd="${name}-d"]`).value;return B49.jToG(+y,+m,+d);};

// ---- شمارش نقش ----
B49.isAdmin=()=>B49.profile&&B49.profile.role==='admin';

// ---- روتر ----
B49.routes={};
B49.go=(h)=>{location.hash=h;};
// رندر مسیر ادمین داخل #content (پس از mountShell)
B49.renderAdmin=async()=>{
  const h=location.hash.replace('#','')||'dashboard';
  const name=h.split('/')[0];
  const args=h.split('/').slice(1);
  const r=B49.routes[name]||B49.routes.dashboard;
  $('.topbar .tt').textContent=r.title;
  if($('#nav'))$('#nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.r===name));
  const c=$('#content'); c.innerHTML='<div class="empty">در حال بارگذاری…</div>';
  try{ await r.render(args); }catch(e){ c.innerHTML='<div class="empty">خطا در بارگذاری صفحه</div>'; console.error(e); }
  if(window.innerWidth<=860&&$('#sidebar'))$('#sidebar').classList.remove('open');
  if($('.scrim'))$('.scrim').classList.remove('show');
};
// روتر سراسری: لندینگ عمومی یا پنل ادمین
B49.route=async()=>{
  const h=location.hash.replace('#','')||'home';
  const name=h.split('/')[0];
  if(B49.PUBLIC_ROUTES.has(name)){ await B49.showLanding(h); return; }
  if(!B49.isAdmin()){ await B49.showLanding('home'); return; }
  if(!B49._shellOn){ B49.mountShell(); }
  else { await B49.renderAdmin(); }
};

// ============ صفحه تنظیم اتصال به Supabase ============
B49.setupScreen=()=>`
<div class="auth-wrap"><div class="auth-card">
  <div class="auth-logo"><img src="logo.png" alt="ساختمان ۴۹"></div>
  <div class="auth-title">ساختمان ۴۹</div>
  <div class="auth-sub">اتصال به پایگاه‌داده</div>
  <div class="field"><label>Project URL</label><input class="inp" id="su-url" value="${B49.cfg.url}"></div>
  <div class="field"><label>anon public key</label><input class="inp" id="su-key" placeholder="eyJP… (از Supabase › Settings › API)"></div>
  <button class="btn btn-primary btn-block" id="su-go">ذخیره و اتصال</button>
  <div class="hint">این کلید عمومی (anon) است و فقط دسترسی‌های مجاز را اجازه می‌دهد؛ امن است در مرورگر قرار گیرد.<br>مسیر دریافت: <b>Supabase Dashboard › Settings › API › Project URL و anon public key</b></div>
</div></div>`;
B49.bindSetup=()=>{
  $('#su-go').onclick=()=>{
    const url=$('#su-url').value.trim(),key=$('#su-key').value.trim();
    if(!url||!key){B49.toast('هر دو فیلد لازم است','err');return;}
    localStorage.setItem('b49_url',url);localStorage.setItem('b49_key',key);
    B49.toast('ذخیره شد. در حال بارگذاری…','ok');setTimeout(()=>location.reload(),600);
  };
};

// ============ صفحه ورود / ثبت‌نام ============
B49.authScreen=(mode='login')=>`
<div class="auth-wrap"><div class="auth-card">
  <div class="auth-logo"><img src="logo.png" alt="ساختمان ۴۹"></div>
  <div class="auth-title">ساختمان ۴۹</div>
  <div class="auth-sub">سامانه مدیریت ساختمان</div>
  <div class="auth-tabs"><button data-m="login" class="${mode==='login'?'active':''}">ورود</button><button data-m="signup" class="${mode==='signup'?'active':''}">ثبت‌نام</button></div>
  ${mode==='signup'?`<div class="field"><label>نام و نام خانوادگی</label><input class="inp" id="au-name" placeholder="مثلاً علی رضایی"></div>`:''}
  <div class="field"><label>ایمیل</label><input class="inp" id="au-email" type="email" placeholder="you@email.com" dir="ltr"></div>
  <div class="field"><label>رمز عبور</label><input class="inp" id="au-pass" type="password" placeholder="حداقل ۶ کاراکتر" dir="ltr"></div>
  <button class="btn btn-primary btn-block" id="au-go">${mode==='login'?'ورود':'ثبت‌نام'}</button>
  <div class="hint">👥 ورود با ایمیل انجام می‌شود.<br>اولین کاربری که ثبت‌نام می‌کند نقش <b>عضو</b> می‌گیرد؛ برای تبدیل به <b>مدیر (admin)</b> در Supabase جدول <code>profiles</code> ستون <code>role</code> را روی <code>admin</code> بگذارید.<br>💡 برای راحتی، در Supabase › Authentication › Providers › Email گزینه «Confirm email» را خاموش کنید.</div>
  <div class="auth-switch"><a id="au-reset">رمز عبور را فراموش کرده‌ام</a></div>
</div></div>`;
B49.bindAuth=(mode='login')=>{
  $$('.auth-tabs button').forEach(b=>b.onclick=()=>{$('#app').innerHTML=B49.authScreen(b.dataset.m);B49.bindAuth(b.dataset.m);});
  $('#au-go').onclick=async()=>{
    const email=$('#au-email').value.trim(),pass=$('#au-pass').value;
    if(!email||!pass){B49.toast('ایمیل و رمز را وارد کنید','err');return;}
    B49.toast('لطفاً صبر کنید…','ok');
    if(mode==='login'){
      const {data,error}=await B49.sb.auth.signInWithPassword({email,password:pass});
      if(error){B49.toast(B49.faErr(error.message),'err');return;}
      await B49.loadProfile(data.user);
      location.hash=B49.isAdmin()?'dashboard':'home';B49.route();
    }else{
      const name=$('#au-name').value.trim();
      const {data,error}=await B49.sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
      if(error){B49.toast(B49.faErr(error.message),'err');return;}
      if(data.session){await B49.loadProfile(data.user);location.hash=B49.isAdmin()?'dashboard':'home';B49.route();}
      else{B49.toast('ثبت‌نام شد. در صورت فعال‌بودن تأیید ایمیل، ایمیل خود را بررسی کنید.','ok');}
    }
  };
  const r=$('#au-reset'); if(r)r.onclick=async()=>{
    const email=$('#au-email').value.trim();if(!email){B49.toast('ایمیل را وارد کنید','err');return;}
    const {error}=await B49.sb.auth.resetPasswordForEmail(email);
    B49.toast(error?error.message:'لینک بازیابی ارسال شد',error?'err':'ok');
  };
};

// ============ اسکلت اصلی ============
B49.NAV=[
  {g:'مالی',items:[
    {r:'dashboard',i:'📊',t:'داشبورد'},
    {r:'reports',i:'📈',t:'گزارش‌ها'},
  ]},
  {g:'مالی — مدیریت',items:[
    {r:'manage-units',i:'🏢',t:'مدیریت واحدها',admin:true},
    {r:'owners',i:'👤',t:'مالکین',admin:true},
    {r:'tenants',i:'🔑',t:'مستاجرین',admin:true},
    {r:'expenses',i:'💸',t:'هزینه‌ها',admin:true},
    {r:'charges',i:'🏷️',t:'شارژ ماهانه',admin:true},
    {r:'construction',i:'🏗️',t:'شارژ عمرانی',admin:true},
    {r:'payments',i:'💰',t:'پرداخت‌ها',admin:true},
  ]},
  {g:'ساکنین',items:[
    {r:'announcements',i:'📢',t:'اعلانات'},
    {r:'maintenance',i:'🛠️',t:'درخواست تعمیرات'},
    {r:'polls',i:'🗳️',t:'نظرسنجی'},
    {r:'documents',i:'📁',t:'آرشیو اسناد'},
    {r:'messages',i:'✉️',t:(a)=>a?'صندوق پیام‌ها':'پیام به مدیر'},
  ]},
  {g:'تنظیمات',items:[
    {r:'admins',i:'🛡️',t:'کاربران و مدیران',admin:true},
    {r:'settings',i:'⚙️',t:'تنظیمات ساختمان',admin:true},
  ]},
];
B49.mountShell=()=>{
  const inboxBadge=B49._unread||0;
  const navHtml=B49.NAV.map(grp=>{
    const items=grp.items.filter(it=>!it.admin||B49.isAdmin());
    if(!items.length)return '';
    return `<div class="grp">${grp.g}</div>`+items.map(it=>{
      const t=typeof it.t==='function'?it.t(B49.isAdmin()):it.t;
      const badge=(it.r==='messages'&&B49.isAdmin()&&inboxBadge)?`<span class="bd">${B49.faDigits(inboxBadge)}</span>`:'';
      return `<a data-r="${it.r}" href="#${it.r}"><span class="ic">${it.i}</span>${t}${badge}</a>`;
    }).join('');
  }).join('');
  $('#app').innerHTML=`
    <div class="scrim" id="scrim"></div>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="side-head"><img src="logo.png"><div class="bn">ساختمان ۴۹<small>سامانه مدیریت</small></div></div>
        <nav class="nav" id="nav">${navHtml}</nav>
        <div class="side-foot">
          <div class="u">
            <div class="av">${(B49.profile.full_name||B49.user.email||'؟').trim().charAt(0)}</div>
            <div><div class="nm">${B49.escape(B49.profile.full_name||B49.user.email)}</div>
            <div class="rl"><span class="pill ${B49.isAdmin()?'pill-admin':'pill-member'}">${B49.isAdmin()?'مدیر':'عضو'}</span></div></div>
          </div>
          <button class="btn btn-ghost btn-sm btn-block" id="logout" style="margin-top:10px">خروج</button>
        </div>

// ============ کمک: محاسبه مانده واحد ============
B49.preloadFinance=async()=>{
  if(B49.cache.fin)return B49.cache.fin;
  const [charges,payments,units,owners,tenants,expenses,cats]=await Promise.all([
    B49.q.all('charges'),B49.q.all('payments'),B49.q.all('units','*',['number',true]),
    B49.q.all('owners'),B49.q.all('tenants'),B49.q.all('expenses','*',['expense_date',false]),
    B49.q.all('expense_categories')
  ]);
  B49.cache.fin={charges,payments,units,owners,tenants,expenses,cats};
  return B49.cache.fin;
};
B49.ownerOf=(uid)=>B49.cache.fin?.owners.find(o=>o.unit_id===uid);
B49.tenantOf=(uid)=>B49.cache.fin?.tenants.find(t=>t.unit_id===uid);
B49.unitBalance=(uid,type=null)=>{
  const f=B49.cache.fin;if(!f)return {due:0,paid:0,bal:0};
  const cf=c=>c.unit_id===uid&&(type?c.type===type:true);
  const pf=p=>p.unit_id===uid&&(type?p.type===type:true);
  const due=(f.charges.filter(cf)).reduce((s,c)=>s+Number(c.amount_due||0),0);
  const paid=(f.payments.filter(pf)).reduce((s,p)=>s+Number(p.amount||0),0);
  return {due,paid,bal:due-paid};
};

// ============ موتور CRUD عمومی ============
// cfg: {title,desc,table,order,searchKeys,canWrite,columns:[{key,label,num,render}],form:[{key,label,type,options,optionsSource,req,ph}],seed(row),afterSave}
B49.cruds={};
B49.makeCrud=(cfg)=>{
  const render=async(args)=>{
    await B49.preloadFinance();
    let rows=await B49.q.all(cfg.table,'*',cfg.order||['created_at',false]);
    if(cfg.transform)rows=cfg.transform(rows);
    const q=(args&&args[0])?decodeURIComponent(args[0]):'';
    if(q&&cfg.searchKeys){const ql=q.toLowerCase();rows=rows.filter(r=>cfg.searchKeys.some(k=>String(r[k]||'').toLowerCase().includes(ql)));}
    const canWrite=cfg.canWrite!==false&&B49.isAdmin();
    // resolve display for option-based columns
    const optResolvers={};
    cfg.form.forEach(f=>{if(f.optionsSource){optResolvers[f.key]=f.optionsSource();}});
    const colHtml=cfg.columns.map(c=>`<th${c.num?' class="num"':''}>${c.label}</th>`).join('')+(canWrite?'<th></th>':'');
    const rowHtml=rows.length?rows.map(r=>'<tr>'+cfg.columns.map(c=>{
      let v=r[c.key];
      if(c.render)v=c.render(v,r);
      else if(c.money)v=B49.rial(v);
      else if(c.jdate)v=B49.gToJstr(v);
      else if(c.jmonth)v=B49.jMonthLabel(v);
      else if(c.optionsKey){const o=(optResolvers[c.optionsKey]||[]).find(x=>x.value==(v));v=o?o.label:(v||'—');}
      else v=B49.escape(v);
      return `<td${c.num?' class="num"':''}>${v??'—'}</td>`;
    }).join('')+(canWrite?`<td><div class="row-actions"><button class="btn btn-ghost btn-sm" data-edit="${r.id}">✎</button><button class="btn btn-danger btn-sm" data-del="${r.id}">🗑</button></div></td>`:'')+'</tr>').join(''):`<tr><td colspan="${cfg.columns.length+1}" class="empty">موردی ثبت نشده است</td></tr>`;
    $('#content').innerHTML=`
      <div class="page-head"><h1>${cfg.title}</h1>${cfg.desc?`<span class="desc">${cfg.desc}</span>`:''}
      <div class="acts">
        <input class="inp" id="crud-q" placeholder="🔍 جستجو…" value="${B49.escape(q)}" style="min-width:180px">
        ${canWrite?`<button class="btn btn-primary btn-sm" id="add-btn">＋ افزودن</button>`:''}
      </div></div>
      <div class="card" style="padding:0"><div class="tbl-wrap"><table><thead><tr>${colHtml}</tr></thead><tbody>${rowHtml}</tbody></table></div></div>`;
    $('#crud-q').oninput=B49._debounce(()=>{const v=$('#crud-q').value.trim();location.hash=cfg.route+'/'+encodeURIComponent(v);},350);
    if(canWrite){$('#add-btn').onclick=()=>B49.crudForm(cfg,null);
      $$('[data-edit]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id==b.dataset.edit);B49.crudForm(cfg,r);});
      $$('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف شود؟')){await B49.q.del(cfg.table,b.dataset.del);B49.cache.fin=null;B49.cruds[cfg.route].render([]);}});
    }
  };
  B49.routes[cfg.route]={title:cfg.title,render};
  B49.cruds[cfg.route]={render};
};
B49._debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
B49.crudForm=(cfg,row)=>{
  const isEdit=!!row;
  const body=cfg.form.map(f=>{
    let val=row?row[f.key]:'';
    if(f.type==='money'&&val)val=B49.faDigits(Number(val).toLocaleString('en-US'));
    if(f.type==='select'){
      let opts=f.options?f.options():(f.optionsSource?f.optionsSource():[]);
      return `<div class="field ${f.full?'full':''}"><label>${B49.lb(f.label,f.req)}</label>
        <select class="inp" name="${f.key}"><option value="">— انتخاب —</option>${opts.map(o=>`<option value="${o.value}" ${String(val)==String(o.value)?'selected':''}>${B49.escape(o.label)}</option>`).join('')}</select></div>`;
    }
    if(f.type==='textarea')return `<div class="field full"><label>${B49.lb(f.label,f.req)}</label><textarea class="inp" name="${f.key}">${B49.escape(val)}</textarea></div>`;
    if(f.type==='jdate')return `<div class="field full"><label>${B49.lb(f.label,f.req)}</label>${B49.jDateField(f.key,row?row[f.key]:null)}</div>`;
    if(f.type==='month'){const j=B49.jNow();let y=j.y,m=j.m;if(val){const p=String(val).split('/').map(Number);y=p[0];m=p[1];}
      const ys=[];for(let yy=j.y+1;yy>=j.y-4;yy--)ys.push(`<option value="${yy}" ${yy===y?'selected':''}>${B49.faDigits(yy)}</option>`);
      const ms=B49.jMonths.map((n,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${n}</option>`).join('');
      return `<div class="field"><label>${B49.lb(f.label,f.req)}</label><div class="form-row"><select class="inp" data-mh="${f.key}-y">${ys.join('')}</select><select class="inp" data-mh="${f.key}-m">${ms}</select></div></div>`;}
    const isMoney=f.type==='money';
    return `<div class="field ${f.full?'full':''}"><label>${B49.lb(f.label,f.req)}</label><input class="inp ${isMoney?'money-inp':''}" name="${f.key}" type="text" inputmode="${isMoney?'numeric':'text'}" value="${B49.escape(val)}" placeholder="${f.ph||(isMoney?'مثلاً ۱٬۵۰۰٬۰۰۰':'')}" ${f.dir?'dir="'+f.dir+'"':''}></div>`;
  }).join('');
  const foot=`<button class="btn btn-ghost" id="f-cancel">انصراف</button><button class="btn btn-primary" id="f-save">ذخیره</button>`;
  const m=B49.modal((isEdit?'ویرایش':'افزودن')+' — '+cfg.title,body,foot);
  m.querySelectorAll('.money-inp').forEach(inp=>inp.addEventListener('input',()=>B49.fmtMoneyLive(inp)));
  $('#f-cancel').onclick=()=>m.remove();
  $('#f-save').onclick=async()=>{
    const obj={};
    for(const f of cfg.form){
      const node=m.querySelector(`[name="${f.key}"]`);
      if(f.type==='select'){obj[f.key]=node.value||null;}
      else if(f.type==='jdate'){obj[f.key]=B49.jDateVal(m,f.key);}
      else if(f.type==='month'){obj[f.key]=m.querySelector(`[data-mh="${f.key}-y"]`).value+'/'+m.querySelector(`[data-mh="${f.key}-m"]`).value.padStart(2,'0');}
      else if(f.type==='money'){const v=B49.toEn(node.value).replace(/[^\d]/g,'');obj[f.key]=v?parseInt(v):0;}
      else {obj[f.key]=node.value.trim()||null;}
      if(f.req&&!obj[f.key]&&obj[f.key]!==0){B49.toast(f.label+' الزامی است','err');return;}
    }
    if(cfg.seed)cfg.seed(obj);
    if(cfg.createdBy&&B49.user)obj.created_by=B49.user.id;
    let res;
    if(isEdit)res=await B49.q.update(cfg.table,row.id,obj);
    else res=await B49.q.insert(cfg.table,obj);
    if(res){B49.cache.fin=null;m.remove();B49.cruds[cfg.route].render([]);}
  };
};

B49.routes.polls={title:'نظرسنجی',render:async()=>{
  const polls=await B49.q.all('polls','*',['created_at',false]);
  const votes=await B49.q.all('poll_votes');
  const can=B49.isAdmin();
  const myVote=pid=>votes.find(v=>v.poll_id===pid&&v.user_id===B49.user.id);
  $('#content').innerHTML=`<div class="page-head"><h1>نظرسنجی</h1><span class="desc">رأی‌گیری عمومی ساکنین</span>
    <div class="acts">${can?'<button class="btn btn-primary btn-sm" id="add">＋ نظرسنجی جدید</button>':''}</div></div>
    <div class="grid" style="gap:12px">${polls.length?polls.map(p=>{
      const opts=p.options||[];const counts=opts.map((_,i)=>votes.filter(v=>v.poll_id===p.id&&v.option_index===i).length);
      const total=counts.reduce((a,b)=>a+b,0);const mine=myVote(p.id);
      return `<div class="card"><h3 style="color:var(--text)">${B49.escape(p.question)}</h3>
      <div class="tiny muted" style="margin-bottom:10px">${B49.faDigits(total)} رأی</div>
      ${opts.map((o,i)=>{const pct=total?Math.round(counts[i]/total*100):0;const mineCls=mine&&mine.option_index===i?'border:1px solid var(--primary)':'';
        return `<div data-vote="${p.id}" data-i="${i}" style="margin-bottom:8px;cursor:${mine?'default':'pointer'}" >
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span>${B49.escape(o)}${mine&&mine.option_index===i?' ✓':''}</span><span class="muted">${B49.faDigits(pct)}٪</span></div>
          <div style="height:8px;background:var(--panel2);border-radius:5px;overflow:hidden"><div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--primary),#9b7bff);${mineCls}"></div></div>
        </div>`;}).join('')}
      ${mine?'<div class="tiny muted">رأی شما ثبت شد</div>':'<div class="tiny">برای رأی دادن روی یک گزینه کلیک کنید</div>'}
      ${can?`<div class="row-actions" style="margin-top:8px"><button class="btn btn-danger btn-sm" data-d="${p.id}">🗑 حذف</button></div>`:''}
      </div>`;}).join(''):'<div class="empty">نظرسنجی فعالی نیست</div>'}</div>`;
  if(can){$('#add').onclick=()=>B49.pollForm();$$('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('حذف شود؟')){await B49.q.del('polls',b.dataset.d);B49.routes.polls.render([]);}});}
  if(!can)$$('[data-vote]').forEach(d=>d.onclick=async()=>{if(myVote(+d.dataset.vote))return;
    await B49.q.insert('poll_votes',{poll_id:+d.dataset.vote,option_index:+d.dataset.i,user_id:B49.user.id});B49.routes.polls.render([]);});
}};

      ${fPay.length?fPay.map(p=>{const u=units.find(x=>x.id===p.unit_id);return `<tr><td>${B49.gToJstr(p.payment_date)}</td><td>${u?B49.faDigits(u.number):'—'}</td><td>${p.jmonth?B49.jMonthLabel(p.jmonth):'—'}</td><td><span class="badge ${p.type==='construction'?'b-construction':'b-monthly'}">${p.type==='construction'?'عمرانی':'ماهانه'}</span></td><td class="muted">${({cash:'نقد',bank:'واریز',card:'کارت'})[p.method]||'-'}</td><td class="num">${B49.rial(p.amount)}</td></tr>`;}).join(''):'<tr><td colspan="6" class="empty">پرداختی نیست</td></tr>'}

B49.reportData=(cur,type)=>{
  const {charges,payments,expenses,units,cats}=B49.cache.fin;
  const fCh=charges.filter(c=>(!cur||cur==='all'||c.jmonth===cur)&&(!type||type==='all'||c.type===type));
  const fPay=payments.filter(p=>(!cur||cur==='all'||p.jmonth===cur)&&(!type||type==='all'||p.type===type));
  const fExp=expenses.filter(e=>(!cur||cur==='all'||e.jmonth===cur));

};
B49.exportExcel=(cur,type)=>{
  const {fCh,fPay,fExp,units,cats}=B49.reportData(cur,type);
  const wb=XLSX.utils.book_new();
  const due=fCh.reduce((s,c)=>s+Number(c.amount_due||0),0);
  const paid=fPay.reduce((s,p)=>s+Number(p.amount||0),0);
  const expT=fExp.reduce((s,e)=>s+Number(e.amount||0),0);
  const uname=u=>u?(u.number+''):'—';
  // خلاصه
  const sum=[['ساختمان ۴۹ — گزارش مالی'],[],['ماه',(cur&&cur!=='all')?B49.jMonthLabel(cur):'همه ماه‌ها'],['نوع',{all:'همه',monthly:'ماهانه',construction:'عمرانی'}[type||'all']],[],['شارژ تعلق‌گرفته (ریال)',due],['پرداخت‌شده (ریال)',paid],['مانده (ریال)',due-paid],['هزینه‌ها (ریال)',expT],['مانده خالص (ریال)',paid-expT]];
  const ws1=XLSX.utils.aoa_to_sheet(sum);ws1['!cols']=[{wch:28},{wch:22}];XLSX.utils.book_append_sheet(wb,ws1,'خلاصه');
  // پرداخت‌ها
  const payRows=[['تاریخ','واحد','ماه','نوع','روش','مبلغ (ریال)'],...fPay.map(p=>{const u=units.find(x=>x.id===p.unit_id);return [B49.gToJstr(p.payment_date),u?u.number:'—',p.jmonth||'',p.type,p.method,p.amount];})];
  const ws2=XLSX.utils.aoa_to_sheet(payRows);XLSX.utils.book_append_sheet(wb,ws2,'پرداخت‌ها');
  // هزینه‌ها
  const expRows=[['تاریخ','دسته','عنوان','مبلغ (ریال)'],...fExp.map(e=>{const c=cats.find(x=>x.id===e.category_id);return [B49.gToJstr(e.expense_date),c?c.name:'',e.title,e.amount];})];
  const ws3=XLSX.utils.aoa_to_sheet(expRows);XLSX.utils.book_append_sheet(wb,ws3,'هزینه‌ها');
  // واحدها
  const unitRows=[['واحد','طبقه','شارژ (ریال)','پرداخت (ریال)','مانده (ریال)','وضعیت'],...units.map(u=>{const b=B49.unitBalance(u.id,type==='all'?null:type);return [u.number,u.floor,b.due,b.paid,b.bal,b.bal>0?'بدهکار':b.bal<0?'طلبکار':'تسویه'];})];
  const ws4=XLSX.utils.aoa_to_sheet(unitRows);XLSX.utils.book_append_sheet(wb,ws4,'واحدها');
  const fn='ساختمان۴۹-گزارش-'+((cur&&cur!=='all')?cur:'همه')+'.xlsx';
  XLSX.writeFile(wb,fn);B49.toast('فایل Excel ذخیره شد','ok');
};

  };
  if(B49._pubUnits)B49.bindUnitCards();
  const pm=$('#pm-go');if(pm)pm.onclick=async()=>{const name=$('#pm-name').value.trim(),body=$('#pm-body').value.trim();if(!name||!body){B49.toast('نام و متن پیام الزامی است','err');return;}const r=await B49.q.insert('messages',{from_name:name,from_user:null,subject:$('#pm-sub').value.trim(),body});if(r){['pm-name','pm-phone','pm-sub','pm-body'].forEach(i=>{const x=$('#'+i);if(x)x.value='';});}};
  const mt=$('#mt-go');if(mt)mt.onclick=async()=>{const name=$('#mt-name').value.trim(),title=$('#mt-title').value.trim();if(!name||!title){B49.toast('نام و عنوان الزامی است','err');return;}const desc='از طرف '+name+': '+($('#mt-desc').value.trim());const r=await B49.q.insert('maintenance_requests',{unit_id:null,title,description:desc,priority:'normal',created_by:null});if(r){['mt-name','mt-title','mt-desc'].forEach(i=>{const x=$('#'+i);if(x)x.value='';});}};
};
B49.unitsGridHtml=(units)=>{
  if(!units.length)return '<div class="land-empty">واحدی ثبت نشده است.</div>';
  const byFloor={};units.forEach(u=>{byFloor[u.floor]=byFloor[u.floor]||[];byFloor[u.floor].push(u);});
  const floors=Object.keys(byFloor).sort((a,b)=>a-b);
  return floors.map(fl=>`<div class="floor-label">طبقه ${B49.faDigits(fl)}</div><div class="units-grid">`+
    byFloor[fl].map(u=>{const bal=Number(u.balance||0);let cls='bal-clear',txt='تسویه';
      if(u.status==='debt'){cls='bal-debt';txt='بدهکار';}else if(u.status==='credit'){cls='bal-cred';txt='طلبکار';}
      return `<div class="unit-card" data-unit="${u.id}"><div class="un">${B49.faDigits(u.number)}</div><div class="fl">طبقه ${B49.faDigits(u.floor)}</div><div class="ow">${B49.escape(u.owner_name||'—')}</div><div class="bal ${cls}">${txt}${bal?' • '+B49.rialShort(bal):''}</div></div>`;
    }).join('')+`</div>`).join('');
};
B49.bindUnitCards=()=>{$$('.unit-card[data-unit]').forEach(c=>c.onclick=()=>{location.hash='unit/'+c.dataset.unit;});};
B49.landingUnit=async(id)=>{
  const authBtns=B49.isAdmin()?`<a class="btn btn-primary btn-sm" href="#dashboard">پنل مدیریت</a>`:`<button class="btn btn-primary btn-sm" id="l-login">ورود مدیر</button>`;
  let u=null;
  if(B49._pubUnits)u=B49._pubUnits.find(x=>String(x.id)===String(id));
  if(!u&&B49.isAdmin()){await B49.preloadFinance();const fu=B49.cache.fin.units.find(x=>String(x.id)===String(id));if(fu){const b=B49.unitBalance(fu.id);u={id:fu.id,number:fu.number,floor:fu.floor,area:fu.area,owner_name:(B49.ownerOf(fu.id)||{}).name,tenant_name:(B49.tenantOf(fu.id)||{}).name,due:b.due,paid:b.paid,balance:b.bal,status:b.bal>0?'debt':b.bal<0?'credit':'clear'};}}
  if(!u){$('#app').innerHTML=`<div class="land"><div class="ltop"><div class="ltop-in"><div class="lg"><img src="logo.png">ساختمان ۴۹</div><div class="lnav"><a href="#home">خانه</a></div>${authBtns}</div></div><div class="lwrap"><div class="land-empty">برای مشاهده‌ی این واحد ابتدا با کد دسترسی وارد شوید. <a href="#home">بازگشت</a></div></div></div>`;if(!B49.isAdmin()){$('#l-login')&&($('#l-login').onclick=()=>B49.loginModal());}return;}
  let col='green',txt='تسویه';if(u.status==='debt'){col='red';txt='بدهکار';}else if(u.status==='credit'){col='blue';txt='طلبکار';}
  const bal=Number(u.balance||0);
  $('#app').innerHTML=`
  <div class="land">
    <div class="ltop"><div class="ltop-in"><div class="lg"><img src="logo.png">ساختمان ۴۹</div><div class="lnav"><a href="#home">خانه</a><a href="#home">واحدها</a></div>${authBtns}</div></div>
    <div class="lwrap">
      <div class="pub-unit fade-up">
        <a class="btn btn-ghost btn-sm back" href="#home">→ بازگشت به واحدها</a>
        <div class="pub-head"><div class="num">${B49.faDigits(u.number)}</div><div><div style="font-size:19px;font-weight:800">واحد ${B49.faDigits(u.number)}</div><div class="meta">طبقه ${B49.faDigits(u.floor)} • ${B49.faDigits(u.area||'-')} متر مربع</div></div></div>
        <div class="status-big" style="background:var(--${col}-soft);color:var(--${col})">${txt} ${bal?'• '+B49.rial(bal):''}</div>
        <div class="divider"></div>
        <div class="info-grid">
          <div class="info-item"><div class="l">مالک</div><div class="v">${B49.escape(u.owner_name||'— ثبت نشده')}</div></div>
          <div class="info-item"><div class="l">مستاجر</div><div class="v">${B49.escape(u.tenant_name||'— (مالک ساکن)')}</div></div>
          <div class="info-item"><div class="l">کل شارژ تعلق‌گرفته</div><div class="v">${B49.rial(u.due)}</div></div>
          <div class="info-item"><div class="l">کل پرداخت‌شده</div><div class="v">${B49.rial(u.paid)}</div></div>
        </div>
        <div class="divider"></div>
        <div class="hint">اطلاعات تماس مالک محفوظ است. برای ریز پرداخت‌ها و گزارش کامل، مدیر ساختمان وارد پنل شود.</div>
        ${B49.isAdmin()?`<div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="B49.exportUnitExcel(${u.id})">📊 خروجی Excel واحد</button><button class="btn btn-ghost btn-sm" onclick="B49.exportUnitPDF(${u.id})">🖨 خروجی PDF واحد</button></div>`:''}
      </div>
      <div class="lfooter">ساختمان ۴۹ — سامانه مدیریت</div>
    </div>
  </div>`;
  if(!B49.isAdmin()){$('#l-login')&&($('#l-login').onclick=()=>B49.loginModal());}
};
B49.loginModal=()=>{
  const m=B49.modal('ورود مدیر',`
    <div class="field"><label>ایمیل</label><input class="inp" id="lm-email" type="email" dir="ltr"></div>
    <div class="field"><label>رمز عبور</label><input class="inp" id="lm-pass" type="password" dir="ltr"></div>
    <div class="hint tiny">فقط مدیران ساختمان به پنل مدیریت دسترسی دارند. حساب ندارید؟ <a id="lm-signup" style="cursor:pointer;color:var(--primary);font-weight:700">ثبت‌نام</a></div>`,
    `<button class="btn btn-ghost" id="lm-c">انصراف</button><button class="btn btn-primary" id="lm-go">ورود</button>`);
  $('#lm-c').onclick=()=>m.remove();
  const sg=$('#lm-signup');if(sg)sg.onclick=()=>{m.remove();$('#app').innerHTML=B49.authScreen('signup');B49.bindAuth('signup');};
  $('#lm-go').onclick=async()=>{const email=$('#lm-email').value.trim(),pass=$('#lm-pass').value;if(!email||!pass){B49.toast('ایمیل و رمز را وارد کنید','err');return;}
    const {data,error}=await B49.sb.auth.signInWithPassword({email,password:pass});
    if(error){B49.toast(B49.faErr(error.message),'err');return;}
    await B49.loadProfile(data.user);
    if(B49.isAdmin()){m.remove();B49.toast('خوش آمدید','ok');location.hash='dashboard';B49.route();}
    else{B49.toast('این حساب مدیر نیست','err');await B49.sb.auth.signOut();B49.user=null;B49.profile=null;}
  };
};

/*__APPEND__*/

// ---- بوت ----
B49.boot=async()=>{
  const app=$('#app');
  if(!B49.cfg.key){ app.innerHTML=B49.setupScreen(); B49.bindSetup(); return; }
  const {data:{session}}=await B49.sb.auth.getSession();
  if(session){ await B49.loadProfile(session.user); }
  await B49.route();
};
B49.loadProfile=async(u)=>{
  B49.user=u;
  const {data}=await B49.sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
  B49.profile=data||(await B49.sb.from('profiles').select('*').eq('id',u.id).maybeSingle());
  if(!B49.profile){B49.profile={id:u.id,full_name:u.email,role:'member'};}
};
window.addEventListener('hashchange',B49.route);
document.addEventListener('DOMContentLoaded',B49.boot);
</script>
</body>
</html>
