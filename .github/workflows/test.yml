name: B49 Test Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# هر لایه‌ی تست یک job مستقل است.
# ریپو ساختار تخت دارد (فایل‌ها در ریشه). این CI با این ساختار هماهنگ است.
jobs:
  accounting:
    name: ۱) منطق حسابداری (Node) — توابع واقعی
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: بررسی فایل‌های لازم
        run: |
          test -f b49_accounting.js || { echo "❌ b49_accounting.js موجود نیست"; exit 1; }
          test -f tests/unit/accounting.test.js || { echo "❌ tests/unit/accounting.test.js موجود نیست"; exit 1; }
          echo "✅ فایل‌های حسابداری موجود است."
      - name: آماده‌سازی ساختار مسیر
        run: |
          mkdir -p download/building49
          cp b49_accounting.js download/building49/b49_accounting.js
          echo "✅ b49_accounting.js در download/building49/ کپی شد."
      - name: اجرای تست (توابع واقعی برنامه از b49_accounting.js)
        run: node tests/unit/accounting.test.js
      - name: بارگذاری گزارش (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-report
          path: tests/unit/.last-accounting-report.json
          if-no-files-found: warn

  db:
    name: ۲) دیتابیس — اعتبارسنجی SQL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: بررسی و اعتبارسنجی فایل‌های SQL
        run: |
          echo "=== بررسی وجود فایل‌ها ==="
          for f in schema.sql migration_v2.sql migration_v3.sql; do
            test -f "$f" || { echo "❌ $f موجود نیست"; exit 1; }
            echo "✅ $f موجود است"
          done

          echo ""
          echo "=== بررسی تراز dollar-quoted strings ==="
          for f in schema.sql migration_v2.sql migration_v3.sql; do
            count=$(grep -o '\$\$' "$f" | wc -l)
            if [ $((count % 2)) -ne 0 ]; then
              echo "❌ $f: dollar-quote تراز نیست ($count تعداد)"
              exit 1
            fi
            echo "✅ $f: dollar-quote تراز است ($count تعداد)"
          done

          echo ""
          echo "=== بررسی ADD CONSTRAINT IF NOT EXISTS (ممنوع در SQL واقعی) ==="
          FOUND=0
          for f in schema.sql migration_v2.sql migration_v3.sql; do
            MATCHES=$(grep -v '^\s*--' "$f" | grep -ci 'add constraint if not exists' || true)
            if [ "$MATCHES" -gt 0 ]; then
              echo "❌ $f: ADD CONSTRAINT IF NOT EXISTS در خط غیر کامنت یافت شد:"
              grep -v '^\s*--' "$f" | grep -ni 'add constraint if not exists'
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 0 ]; then
            exit 1
          fi
          echo "✅ هیچ ADD CONSTRAINT IF NOT EXISTS در خطوط غیر کامنت نیست"

          echo ""
          echo "=== بررسی create policy تکراری بدون drop ==="
          for f in migration_v2.sql migration_v3.sql; do
            dup=$(grep -c 'create policy "' "$f" 2>/dev/null || echo 0)
            drops=$(grep -c 'drop policy if exists "' "$f" 2>/dev/null || echo 0)
            if [ "$dup" -gt 0 ] && [ "$drops" -eq 0 ]; then
              echo "⚠️ $f: $dup create policy بدون drop — در اجرای مجدد خطا می‌دهد"
            fi
          done

          echo ""
          echo "✅ اعتبارسنجی SQL کامل شد."

  e2e:
    name: ۳) مرورگر (Playwright) — غیرفعال
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: وضعیت
        run: |
          echo "⚠️ تست مرورگر غیرفعال است."
          echo "دلیل: package.json، playwright.config.js و tests/e2e/app.spec.js در این ریپو (ساختار تخت) وجود ندارند."
          echo "TODO: وقتی ساختار پروژه کامل شد، این job را فعال کنید."

  summary:
    name: 📊 گزارش واحد
    runs-on: ubuntu-latest
    needs: [accounting, db, e2e]
    if: always()
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: تولید گزارش
        run: |
          {
            echo "| لایه | وضعیت | توضیح |"
            echo "|---|---|---|"
            echo "| ۱) منطق حسابداری (Node) | ${{ needs.accounting.result }} | توابع واقعی b49_accounting.js |"
            echo "| ۲) دیتابیس (SQL) | ${{ needs.db.result }} | اعتبارسنجی نحوی: تراز dollar-quote + ADD CONSTRAINT |"
            echo "| ۳) مرورگر (Playwright) | ${{ needs.e2e.result }} | غیرفعال (ساختار تخت) |"
            echo ""
            echo "**راهنما:** success = سبز. failure = قرمز."
          } >> $GITHUB_STEP_SUMMARY
