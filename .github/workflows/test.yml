name: B49 Test Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# هر لایه‌ی تست یک job مستقل است. اگر فایل‌های لازم آپلود نشده باشد،
# آن job FAIL می‌شود (نه skip). هیچ‌وقت نبود تست موفقیت تلقی نمی‌شود.
# Accounting فقط Node لازم دارد (توابع واقعی b49_accounting.js را می‌آزماید).
jobs:
  accounting:
    name: ۱) منطق حسابداری (Node) — توابع واقعی
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: بررسی فایل‌های لازم
        run: |
          test -f tests/unit/accounting.test.js || { echo "❌ tests/unit/accounting.test.js موجود نیست"; exit 1; }
          test -f download/building49/b49_accounting.js || { echo "❌ download/building49/b49_accounting.js موجود نیست"; exit 1; }
          echo "✅ فایل‌های حسابداری موجود است."
      - name: اجرای تست (توابع واقعی برنامه از b49_accounting.js)
        run: node tests/unit/accounting.test.js
      - name: بارگذاری گزارش (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-report
          path: tests/unit/.last-accounting-report.json
          if-no-files-found: error

  db:
    name: ۲) دیتابیس (pgTAP) — روی Supabase محلی
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: بررسی فایل‌های لازم
        run: |
          test -f supabase/config.toml || { echo "❌ supabase/config.toml موجود نیست"; exit 1; }
          test -d supabase/migrations || { echo "❌ supabase/migrations موجود نیست"; exit 1; }
          test -d supabase/tests/database || { echo "❌ supabase/tests/database موجود نیست"; exit 1; }
          echo "✅ فایل‌های دیتابیس موجود است."
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: راه‌اندازی Supabase محلی + reset (seed)
        run: |
          supabase start
          supabase db reset
      - name: اجرای pgTAP (schema + constraints + RLS + RPC + RPCهای update/delete)
        run: supabase test db
      - name: بارگذاری خروجی pgTAP (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-pgtap-output
          path: supabase/tests/database/
          if-no-files-found: warn

  e2e:
    name: ۳) مرورگر (Playwright) — index.html واقعی
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: بررسی فایل‌های لازم
        run: |
          test -f package.json || { echo "❌ package.json موجود نیست"; exit 1; }
          test -f playwright.config.js || { echo "❌ playwright.config.js موجود نیست"; exit 1; }
          test -f tests/e2e/app.spec.js || { echo "❌ tests/e2e/app.spec.js موجود نیست"; exit 1; }
          test -f download/building49/index.html || { echo "❌ download/building49/index.html موجود نیست"; exit 1; }
          test -f download/building49/b49_accounting.js || { echo "❌ b49_accounting.js موجود نیست"; exit 1; }
          test -d supabase/migrations || { echo "❌ supabase/migrations موجود نیست"; exit 1; }
          echo "✅ فایل‌های مرورگر موجود است."
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: نصب وابستگی‌ها
        run: npm install --no-audit --no-fund
      - name: نصب Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: راه‌اندازی Supabase محلی + reset (seed)
        run: |
          supabase start
          supabase db reset
      - name: اجرای Playwright روی index.html واقعی + Supabase محلی
        run: npx playwright test --config=playwright.config.js
        env:
          B49_BASE_URL: http://localhost:3000
          B49_LOCAL_SUPABASE_URL: http://localhost:54321
      - name: بارگذاری گزارش Playwright (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            tests/e2e/.last-e2e-report.json
            playwright-report/
          if-no-files-found: warn

  summary:
    name: 📊 گزارش واحد — وضعیت هر job
    runs-on: ubuntu-latest
    needs: [accounting, db, e2e]
    if: always()
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: تولید گزارش
        run: |
          {
            echo "| لایه | وضعیت | توضیح |"
            echo "|---|---|---|"
            echo "| ۱) منطق حسابداری (Node) | ${{ needs.accounting.result }} | توابع واقعی b49_accounting.js (۳۵ موفق / ۱ پشتیبانی‌نشده) |"
            echo "| ۲) دیتابیس (pgTAP) | ${{ needs.db.result }} | روی Supabase محلی: schema/constraints/RLS/RPC |"
            echo "| ۳) مرورگر (Playwright) | ${{ needs.e2e.result }} | index.html واقعی + Supabase محلی |"
            echo ""
            echo "**راهنما:** \`success\` = سبز. \`failure\` = قرمز (فایل مفقود یا تست ناموفق)."
            echo "**هیچ لایه‌ای skip نمی‌شود** — نبود فایل = failure صریح."
            echo ""
            echo "### اگر تست مرورگر اجرا نشده باشد"
            echo "اگر job «مرورگر» failure است، در Artifact بررسی کن که آیا فایل‌های لازم آپلود شده‌اند و آیا Supabase محلی بالا آمده. هیچ تست اجرا‌نشده‌ای به‌عنوان موفق گزارش نمی‌شود."
          } >> $GITHUB_STEP_SUMMARY
